# ---------- Lookup tables ----------
type Role @table(name: "roles", key: "roleId") {
  roleId: Int!
  roleName: String!            # customer, rider, business
}

type OrderStatus @table(name: "order_status", key: "statusId") {
  statusId: Int!
  statusName: String!          # pending, on_the_way, delivered, cancelled
}

# ---------- Core tables ----------
type User @table(name: "users", key: "userId") {
  userId: String! @default(expr: "auth.uid")   # Firebase Auth UID
  fullName: String!
  contactNumber: String!
  email: String!
  role: Role!                                   # FK -> roles
  createdAt: Timestamp! @default(expr: "request.time")
}

type Station @table(name: "stations") {
  id: UUID! @default(expr: "uuidV4()")
  stationName: String!
  address: String!
  latitude: Float!
  longitude: Float!
}

type Product @table(name: "products") {
  id: UUID! @default(expr: "uuidV4()")
  productName: String!         # e.g., 5-gal round, slim
  unitPrice: Float!
}

type Order @table(name: "orders") {
  id: UUID! @default(expr: "uuidV4()")
  customer: User!                               # FK -> users
  rider: User                                   # FK -> users (nullable until accepted)
  station: Station!                             # FK -> stations
  product: Product!                             # FK -> products
  status: OrderStatus!                          # FK -> order_status
  gallons: Int!
  deliveryLatitude: Float!
  deliveryLongitude: Float!
  preferredDeliveryTime: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

type Payment @table(name: "payments") {
  id: UUID! @default(expr: "uuidV4()")
  order: Order! @unique                         # 1:1 with orders
  amount: Float!
  paymentMethod: String!                        # cash, e-wallet (simulated)
  paymentStatus: String!                        # paid, unpaid
  paidAt: Timestamp
}