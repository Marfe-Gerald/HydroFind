<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">HydroFind icon</title>
  <desc id="desc">A water drop inside a location pin.</desc>

  <defs>
    <linearGradient id="pinGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <g transform="translate(0,-8)">
    <!-- Pin -->
    <path d="M100 178 C70 150 38 116 38 78 A62 62 0 0 1 162 78 C162 116 130 150 100 178 Z"
          fill="url(#pinGradient)"/>
    <!-- Water drop -->
    <g transform="translate(0,-4)">
      <path d="M100 46 C100 46 74 76 74 94 A26 26 0 0 0 126 94 C126 76 100 46 100 46 Z"
            fill="#ffffff"/>
      <!-- Drop highlight -->
      <path d="M87 92 C87 100 91 106 98 108" fill="none" stroke="#93c5fd"
            stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Water ripples under the pin -->
  <ellipse cx="100" cy="176" rx="30" ry="6" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.55"/>
  <ellipse cx="100" cy="184" rx="50" ry="9" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.28"/>
</svg>
